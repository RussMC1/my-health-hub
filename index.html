<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Health Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans pb-24">

    <header class="p-6 bg-white border-b sticky top-0 z-10 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">My Health Hub</h1>
            <p id="status-cloud" class="text-[10px] text-green-600 font-bold uppercase tracking-widest">● Cloud Active</p>
        </div>
        <div class="text-right"><p class="text-xs text-slate-400">Russ</p></div>
    </header>

    <main id="app-content" class="p-4 max-w-md mx-auto">
        
        <div id="tab-dashboard">
            <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-5 rounded-2xl shadow-lg mb-6 text-white">
                <h2 class="text-blue-100 font-bold mb-3 text-xs uppercase tracking-wider">FITVII Vitals</h2>
                <div class="flex justify-between items-center">
                    <div><p class="text-xs opacity-80">HEART RATE</p><p class="text-3xl font-black">74 <span class="text-sm font-light">BPM</span></p></div>
                    <div class="h-10 w-[1px] bg-white/20"></div>
                    <div class="text-right"><p class="text-xs opacity-80">BLOOD PRESSURE</p><p class="text-3xl font-black">122/81</p></div>
                </div>
            </div>
            <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center border-dashed">
                <p class="text-slate-400 text-sm">Next: Linking Google Fit API...</p>
            </div>
        </div>

        <div id="tab-logs" class="hidden">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Voice Lab</h2>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-4 text-center">
                <button id="record-btn" onclick="startRecording()" class="w-20 h-20 bg-red-500 rounded-full border-8 border-red-100 shadow-xl flex items-center justify-center mx-auto mb-4 hover:scale-105 transition">
                    <span class="text-white text-2xl">🎤</span>
                </button>
                <p id="record-status" class="text-sm text-slate-500 font-medium italic">Tap to record Dr. Notes</p>
                <textarea id="transcript-box" class="w-full mt-4 p-3 bg-slate-50 border rounded-xl text-sm h-32 focus:outline-none" placeholder="Transcript will appear here..."></textarea>
                <button onclick="saveNote()" class="mt-3 w-full bg-slate-800 text-white py-3 rounded-xl font-bold">Save Note to Cloud</button>
            </div>
            <div id="notes-list" class="space-y-3"></div>
        </div>

        <div id="tab-schedule" class="hidden">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Appointments</h2>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 text-center italic text-slate-400 text-sm">
                Google Calendar Sync Coming Soon
            </div>
        </div>

        <div id="tab-meds" class="hidden">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Prescriptions</h2>
            <div id="med-list" class="space-y-3 mb-6"></div>
            <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-100">
                <input id="medName" type="text" placeholder="Medication Name" class="w-full p-3 mb-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <input id="medDose" type="text" placeholder="Dosage (e.g. 10mg)" class="w-full p-3 mb-3 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="saveMed()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg">Add Medication</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t flex justify-around p-4 shadow-2xl z-20">
        <button onclick="showTab('dashboard')" class="flex flex-col items-center text-blue-600"><span class="text-lg">🏠</span><span class="text-[10px] font-bold">Home</span></button>
        <button onclick="showTab('logs')" class="flex flex-col items-center text-slate-400"><span class="text-lg">🎤</span><span class="text-[10px] font-bold">Voice</span></button>
        <button onclick="showTab('schedule')" class="flex flex-col items-center text-slate-400"><span class="text-lg">📅</span><span class="text-[10px] font-bold">Dates</span></button>
        <button onclick="showTab('meds')" class="flex flex-col items-center text-slate-400"><span class="text-lg">💊</span><span class="text-[10px] font-bold">Meds</span></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxjmQ3HrsewDi07IjC5gufqFEZxsIrLE4",
            authDomain: "my-health-hub-c0b23.firebaseapp.com",
            projectId: "my-health-hub-c0b23",
            storageBucket: "my-health-hub-c0b23.firebasestorage.app",
            messagingSenderId: "989199750956",
            appId: "1:989199750956:web:f1d33d882a8b1d681c3e89"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI NAVIGATION
        window.showTab = (name) => {
            ['dashboard', 'logs', 'schedule', 'meds'].forEach(t => document.getElementById('tab-'+t).classList.add('hidden'));
            document.getElementById('tab-'+name).classList.remove('hidden');
        };

        // VOICE TRANSCRIPTION LOGIC
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.interimResults = true;

        window.startRecording = () => {
            const btn = document.getElementById('record-btn');
            const status = document.getElementById('record-status');
            if (btn.classList.contains('bg-red-500')) {
                recognition.start();
                btn.classList.replace('bg-red-500', 'bg-green-500');
                status.innerText = "Listening... Tap to stop";
            } else {
                recognition.stop();
                btn.classList.replace('bg-green-500', 'bg-red-500');
                status.innerText = "Recording paused.";
            }
        };

        recognition.onresult = (event) => {
            let text = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                text += event.results[i][0].transcript;
            }
            document.getElementById('transcript-box').value = text;
        };

        window.saveNote = async () => {
            const text = document.getElementById('transcript-box').value;
            if(!text) return;
            await addDoc(collection(db, "notes"), { text, date: new Date().toLocaleString() });
            document.getElementById('transcript-box').value = "";
            alert("Note saved!");
        };

        // LIVE MEDS LIST
        onSnapshot(query(collection(db, "prescriptions"), orderBy("timestamp", "desc")), (snap) => {
            const list = document.getElementById('med-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                list.innerHTML += `<div class="p-4 bg-white border border-slate-100 rounded-xl shadow-sm flex justify-between items-center"><div class="font-bold text-slate-800">${doc.data().name}<div class="text-[10px] text-slate-400 font-normal uppercase">${doc.data().dosage}</div></div><span class="text-blue-500 text-[10px] font-black uppercase">Active</span></div>`;
            });
        });

        // LIVE NOTES LIST
        onSnapshot(query(collection(db, "notes"), orderBy("date", "desc")), (snap) => {
            const list = document.getElementById('notes-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                list.innerHTML += `<div class="p-4 bg-slate-100 rounded-xl text-sm"><p class="font-bold text-[10px] text-slate-400 mb-1">${doc.data().date}</p>${doc.data().text}</div>`;
            });
        });

        window.saveMed = async () => {
            const name = document.getElementById('medName').value;
            const dose = document.getElementById('medDose').value;
            await addDoc(collection(db, "prescriptions"), { name, dosage: dose, timestamp: new Date() });
            document.getElementById('medName').value = ""; document.getElementById('medDose').value = "";
        };
    </script>
</body>
</html>
