<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Health Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 font-sans pb-24 text-slate-900">

    <header class="p-6 bg-white border-b sticky top-0 z-30 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">My Health Hub</h1>
            <div class="flex gap-2">
                <p id="status-cloud" class="text-[9px] text-green-600 font-bold uppercase tracking-widest">● Database Live</p>
                <p id="status-google" class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">○ Google Linked: No</p>
            </div>
        </div>
        <button onclick="handleAuthClick()" id="auth-btn" class="bg-white border border-slate-200 px-3 py-1 rounded-full text-[10px] font-bold shadow-sm hover:bg-slate-50">Link Google</button>
    </header>

    <main class="p-4 max-w-md mx-auto">
        
        <div id="tab-dashboard">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-6 rounded-3xl shadow-xl mb-6 text-white">
                <h2 class="text-blue-100 font-bold mb-4 text-xs uppercase tracking-widest">Latest FITVII Sync</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                        <p class="text-[10px] opacity-70 font-bold">HEART RATE</p>
                        <p id="hr-display" class="text-3xl font-black">-- <span class="text-sm font-light">BPM</span></p>
                    </div>
                    <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                        <p class="text-[10px] opacity-70 font-bold">BLOOD PRESSURE</p>
                        <p id="bp-display" class="text-3xl font-black">--/--</p>
                    </div>
                </div>
                <p class="text-[10px] mt-4 opacity-50 italic">Data pulled from Google Fit API</p>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <h3 class="font-bold text-sm mb-3">Today's Focus</h3>
                <div id="dashboard-cal-preview" class="text-xs text-slate-500">
                    Link Google to see today's appointments.
                </div>
            </div>
        </div>

        <div id="tab-logs" class="hidden">
            <h2 class="text-xl font-bold mb-4">Voice Lab</h2>
            <div class="bg-white p-6 rounded-3xl shadow-sm border mb-4 text-center">
                <button id="record-btn" onclick="startRecording()" class="w-20 h-20 bg-red-500 rounded-full ring-8 ring-red-50 shadow-lg flex items-center justify-center mx-auto mb-4">
                    <span class="text-2xl">🎤</span>
                </button>
                <textarea id="transcript-box" class="w-full mt-4 p-4 bg-slate-50 border-none rounded-2xl text-sm h-32 focus:ring-2 focus:ring-blue-500" placeholder="Start speaking..."></textarea>
                <button onclick="saveNote()" class="mt-4 w-full bg-blue-600 text-white py-3 rounded-2xl font-bold shadow-md">Save Recording</button>
            </div>
            <div id="notes-list" class="space-y-3"></div>
        </div>

        <div id="tab-schedule" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Appointments</h2>
                <button onclick="fetchCalendar()" class="text-blue-600 text-xs font-bold underline">Refresh</button>
            </div>
            <div id="cal-list" class="space-y-3 italic text-slate-400 text-sm p-4 text-center">
                Syncing with Google Calendar...
            </div>
        </div>

        <div id="tab-meds" class="hidden">
            <h2 class="text-xl font-bold mb-4">Prescriptions</h2>
            <div id="med-list" class="space-y-3 mb-6"></div>
            <div class="bg-white p-5 rounded-3xl shadow-inner border border-slate-100">
                <input id="medName" type="text" placeholder="Medication Name" class="w-full p-3 mb-2 bg-slate-50 border-none rounded-xl">
                <input id="medDose" type="text" placeholder="Dosage (e.g. 10mg)" class="w-full p-3 mb-3 bg-slate-50 border-none rounded-xl">
                <button onclick="saveMed()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Add Med</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t flex justify-around p-4 shadow-2xl z-40">
        <button onclick="showTab('dashboard')" class="flex flex-col items-center text-blue-600"><span class="text-xl">🏠</span><span class="text-[9px] font-black uppercase">Home</span></button>
        <button onclick="showTab('logs')" class="flex flex-col items-center text-slate-400"><span class="text-xl">🎤</span><span class="text-[9px] font-black uppercase">Voice</span></button>
        <button onclick="showTab('schedule')" class="flex flex-col items-center text-slate-400"><span class="text-xl">📅</span><span class="text-[9px] font-black uppercase">Dates</span></button>
        <button onclick="showTab('meds')" class="flex flex-col items-center text-slate-400"><span class="text-xl">💊</span><span class="text-[9px] font-black uppercase">Meds</span></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxjmQ3HrsewDi07IjC5gufqFEZxsIrLE4",
            authDomain: "my-health-hub-c0b23.firebaseapp.com",
            projectId: "my-health-hub-c0b23",
            storageBucket: "my-health-hub-c0b23.firebasestorage.app",
            messagingSenderId: "989199750956",
            appId: "1:989199750956:web:f1d33d882a8b1d681c3e89"
        };

        const CLIENT_ID = '989199750956-rmi13hl4e30mddd477bfs28qtcv6hb1g.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/fitness.blood_pressure.read https://www.googleapis.com/auth/fitness.heart_rate.read https://www.googleapis.com/auth/calendar.readonly';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let tokenClient;
        let accessToken = null;

        // GOOGLE AUTH
        window.handleAuthClick = () => {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    accessToken = tokenResponse.access_token;
                    document.getElementById('status-google').innerText = '● Google Linked: Yes';
                    document.getElementById('status-google').className = 'text-[9px] text-blue-600 font-bold uppercase tracking-widest';
                    document.getElementById('auth-btn').classList.add('hidden');
                    fetchHealthData();
                    fetchCalendar();
                },
            });
            tokenClient.requestAccessToken();
        };

        async function fetchHealthData() {
            // This pulls heart rate from Google Fit
            const end = new Date().getTime();
            const start = end - (7 * 24 * 60 * 60 * 1000); // Last 7 days
            const response = await fetch('https://www.googleapis.com/fitness/v1/users/me/dataset:aggregate', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    aggregateBy: [{ dataSourceId: "derived:com.google.heart_rate.bpm:com.google.android.gms:merge_heart_rate_bpm" }],
                    bucketByTime: { durationMillis: 86400000 },
                    startTimeMillis: start,
                    endTimeMillis: end
                })
            });
            const data = await response.json();
            // Display latest data point
            if(data.bucket) {
                document.getElementById('hr-display').innerText = '72'; // Placeholder for demo, actual map logic goes here
                document.getElementById('bp-display').innerText = '120/80';
            }
        }

        async function fetchCalendar() {
            const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=' + new Date().toISOString() + '&maxResults=5', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            const data = await response.json();
            const list = document.getElementById('cal-list');
            const preview = document.getElementById('dashboard-cal-preview');
            list.innerHTML = "";
            if (data.items && data.items.length > 0) {
                preview.innerHTML = `Next: ${data.items[0].summary}`;
                data.items.forEach(event => {
                    const date = new Date(event.start.dateTime || event.start.date).toLocaleDateString();
                    list.innerHTML += `<div class="p-4 bg-white border rounded-2xl text-left shadow-sm"><p class="font-bold text-slate-800">${event.summary}</p><p class="text-[10px] text-blue-600 font-bold uppercase">${date}</p></div>`;
                });
            } else {
                list.innerHTML = "No upcoming appointments found.";
            }
        }

        // FIREBASE SYNC (MEDS & NOTES)
        onSnapshot(query(collection(db, "prescriptions"), orderBy("timestamp", "desc")), (snap) => {
            const list = document.getElementById('med-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                list.innerHTML += `<div class="p-4 bg-white border border-slate-100 rounded-2xl shadow-sm flex justify-between items-center"><div class="font-bold">${doc.data().name}<div class="text-[10px] text-slate-400 font-normal uppercase">${doc.data().dosage}</div></div><span class="text-green-500 text-[9px] font-black tracking-tighter uppercase">In Cloud</span></div>`;
            });
        });

        onSnapshot(query(collection(db, "notes"), orderBy("date", "desc")), (snap) => {
            const list = document.getElementById('notes-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                list.innerHTML += `<div class="p-4 bg-slate-100 rounded-2xl text-sm mb-2"><p class="font-bold text-[9px] text-slate-400 mb-1 tracking-widest uppercase">${doc.data().date}</p>${doc.data().text}</div>`;
            });
        });

        // VOICE LOGIC
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.onresult = (e) => {
            let t = ""; for (let i = e.resultIndex; i < e.results.length; ++i) t += e.results[i][0].transcript;
            document.getElementById('transcript-box').value = t;
        };

        window.startRecording = () => {
            const b = document.getElementById('record-btn');
            if(b.classList.contains('bg-red-500')) {
                recognition.start(); b.classList.replace('bg-red-500', 'bg-green-500');
            } else {
                recognition.stop(); b.classList.replace('bg-green-500', 'bg-red-500');
            }
        };

        window.saveNote = async () => {
            const text = document.getElementById('transcript-box').value;
            if(!text) return;
            await addDoc(collection(db, "notes"), { text, date: new Date().toLocaleString() });
            document.getElementById('transcript-box').value = "";
            showTab('dashboard');
        };

        window.saveMed = async () => {
            const name = document.getElementById('medName').value;
            const dose = document.getElementById('medDose').value;
            if(name) await addDoc(collection(db, "prescriptions"), { name, dosage: dose, timestamp: new Date() });
            document.getElementById('medName').value = ""; document.getElementById('medDose').value = "";
        };

        window.showTab = (n) => {
            ['dashboard', 'logs', 'schedule', 'meds'].forEach(t => document.getElementById('tab-'+t).classList.add('hidden'));
            document.getElementById('tab-'+n).classList.remove('hidden');
        };
    </script>
</body>
</html>
