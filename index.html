<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Health Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans pb-24">

    <header class="p-6 bg-white border-b sticky top-0 z-10 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">My Health Hub</h1>
            <p id="status-cloud" class="text-xs text-green-600 font-bold underline">● Connected to Cloud</p>
        </div>
        <div class="text-right">
            <p class="text-xs text-slate-500">Welcome, Russ</p>
        </div>
    </header>

    <main id="app-content" class="p-4 max-w-md mx-auto">
        
        <div id="tab-dashboard">
            <section class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6">
                <h2 class="text-blue-800 font-semibold mb-2 text-sm uppercase tracking-wider">My Vitals (from FITVII)</h2>
                <div class="flex justify-between">
                    <div>
                        <p class="text-xs text-slate-500 font-bold uppercase">Heart Rate</p>
                        <p class="text-2xl font-bold text-slate-800">74 <span class="text-sm font-normal">BPM</span></p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-500 font-bold uppercase">Blood Pressure</p>
                        <p class="text-2xl font-bold text-slate-800">122/81 <span class="text-sm font-normal">mmHg</span></p>
                    </div>
                </div>
            </section>
            
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
                <p class="text-slate-400 italic">Next Step: Link Google Fit for live updates...</p>
            </section>
        </div>

        <div id="tab-meds" class="hidden">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Active Prescriptions</h2>
            
            <div id="med-list" class="space-y-3 mb-8 text-slate-700 font-medium">
                <p class="text-sm text-slate-400 italic">Loading your prescriptions...</p>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-inner border border-dashed border-slate-300">
                <h3 class="font-bold text-slate-800 mb-2 text-sm">Add New Entry</h3>
                <input id="medName" type="text" placeholder="Medication Name" class="w-full p-2 mb-2 border rounded">
                <input id="medDose" type="text" placeholder="Dosage (e.g. 10mg)" class="w-full p-2 mb-2 border rounded text-sm">
                <button onclick="saveMed()" class="w-full bg-blue-600 text-white font-bold py-2 rounded shadow-lg">Save to Cloud</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 shadow-2xl z-20">
        <button onclick="showTab('dashboard')" class="nav-btn text-blue-600 text-xs font-bold flex flex-col items-center">
            <span>🏠</span> Dashboard
        </button>
        <button class="text-slate-300 text-xs flex flex-col items-center"><span>📊</span> Logs</button>
        <button class="text-slate-300 text-xs flex flex-col items-center"><span>📅</span> Schedule</button>
        <button onclick="showTab('meds')" class="nav-btn text-slate-400 text-xs flex flex-col items-center">
            <span>💊</span> Meds
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxjmQ3HrsewDi07IjC5gufqFEZxsIrLE4",
            authDomain: "my-health-hub-c0b23.firebaseapp.com",
            projectId: "my-health-hub-c0b23",
            storageBucket: "my-health-hub-c0b23.firebasestorage.app",
            messagingSenderId: "989199750956",
            appId: "1:989199750956:web:f1d33d882a8b1d681c3e89"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // TAB SWITCHING LOGIC
        window.showTab = (tabName) => {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-meds').classList.add('hidden');
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        };

        // SAVE LOGIC
        window.saveMed = async () => {
            const name = document.getElementById('medName').value;
            const dose = document.getElementById('medDose').value;
            if(!name) return alert("Please enter a name");
            try {
                await addDoc(collection(db, "prescriptions"), {
                    name: name,
                    dosage: dose,
                    timestamp: new Date()
                });
                document.getElementById('medName').value = "";
                document.getElementById('medDose').value = "";
            } catch (e) { console.error(e); }
        }

        // AUTO-LOAD LIST LOGIC
        const q = query(collection(db, "prescriptions"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const medList = document.getElementById('med-list');
            medList.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const item = document.createElement('div');
                item.className = "p-3 bg-white border border-slate-200 rounded-lg flex justify-between items-center shadow-sm";
                item.innerHTML = `<div><p class="font-bold text-slate-800">${data.name}</p><p class="text-xs text-slate-500">${data.dosage}</p></div><span class="text-blue-500 text-xs">Active</span>`;
                medList.appendChild(item);
            });
        });
    </script>
</body>
</html>
